name: Daily Market Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: run_pipeline
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_ACCOUNTS: ${{ secrets.TARGET_ACCOUNTS }}
          MOCK_MODE: "False"
        run: python main.py
        continue-on-error: true

      - name: Commit updated history if changed
        if: always()
        run: |
          if [ -f "stocks_history.json" ] && [ -n "$(git status --porcelain -- stocks_history.json)" ]; then
            git config user.name "GitHub Action Bot"
            git config user.email "action-bot@users.noreply.github.com"
            git add stocks_history.json
            git commit -m "🤖 Auto-update: Historical stock data" || true
            git push origin main || true
          else
            echo "No stocks history changes detected."
          fi

      - name: Mark failure if pipeline step failed
        if: steps.run_pipeline.outcome == 'failure'
        run: |
          echo "main.py failed during workflow run."
          exit 1
